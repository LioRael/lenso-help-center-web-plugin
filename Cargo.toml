[package]
name = "lenso-help-center-web"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
description = "Public, job-first Help Center Web surface for a Lenso Support App."
repository = "https://github.com/LioRael/lenso-help-center-web-plugin"
publish = true

[package.metadata.lenso]
plugin-id = "lenso.help-center.web"
root-slot = "web"

[dependencies]
lenso = "0.5.0"
lenso-auth-sdk = "0.2.1"
lenso-capability-auth = "0.1.2"
lenso-capability-http-endpoint = "0.2.7"
lenso-capability-knowledge-base = "0.1.0"
lenso-capability-support-attachment = "0.1.0"
lenso-capability-support-intake = "0.1.0"
lenso-kernel = "0.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = "0.3"

[dev-dependencies]
futures = "0.3"

[workspace]

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
